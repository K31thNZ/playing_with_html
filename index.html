        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 2rem 1rem;
            line-height: 1.6;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        h1 {
            text-align: center;
            font-size: 2.4rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #f97316, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .section-title {
            font-size: 1.8rem;
            margin: 2rem 0 1.5rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 0.5rem;
            color: #f8fafc;
        }

        /* TABS */
        .tab-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: #f97316;
            border-color: #f97316;
            color: #fff;
        }

        /* ACTIVITY CARDS */
        .activities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .activity-card {
            background: #1e293b;
            border-radius: 1rem;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .activity-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border-color: #475569;
        }

        /* Mafia/deduction cards get a moody highlight */
        .activity-card.deduction {
            border-color: #7c3aed;
        }

        .activity-card.deduction:hover {
            border-color: #a78bfa;
            box-shadow: 0 10px 25px rgba(124,58,237,0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #f1f5f9;
            flex: 1;
            margin-right: 0.5rem;
        }

        .category-badge {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .badge-social    { background: #0ea5e9; color: #fff; }
        .badge-deduction { background: #7c3aed; color: #fff; }
        .badge-culture   { background: #059669; color: #fff; }
        .badge-active    { background: #d97706; color: #fff; }
        .badge-creative  { background: #db2777; color: #fff; }

        .vote-area {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-shrink: 0;
        }

        .vote-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #64748b;
            transition: color 0.2s, transform 0.2s;
            line-height: 1;
            padding: 0.2rem;
        }

        .vote-btn.liked { color: #ef4444; animation: pulse 0.3s ease; }
        .vote-btn:hover { transform: scale(1.15); }

        @keyframes pulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .vote-count {
            font-weight: 600;
            color: #cbd5e1;
            min-width: 1.8rem;
            text-align: center;
        }

        .short-desc {
            color: #94a3b8;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            flex-grow: 1;
        }

        .details-toggle {
            background: #334155;
            border: none;
            color: #e2e8f0;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 500;
            margin-bottom: 0.8rem;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .details-toggle:hover { background: #475569; }

        .details-content {
            display: none;
            margin: 0.8rem 0;
            padding: 1rem;
            background: #0f172a;
            border-radius: 0.8rem;
            font-size: 0.9rem;
            color: #cbd5e1;
            border-left: 3px solid #f97316;
            animation: fadeIn 0.3s ease;
        }

        .details-content.deduction-detail { border-left-color: #7c3aed; }
        .details-content.open { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .external-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        .external-link:hover { text-decoration: underline; }

        .venue-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 0.4rem;
        }

        /* LEADERBOARD */
        .leaderboard {
            background: #1e293b;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #334155;
        }

        .leaderboard h3 {
            font-size: 1.1rem;
            color: #f97316;
            margin-bottom: 1rem;
        }

            align-items: center;
            gap: 0.8rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #1e293b;

        .lb-name { flex: 1; font-size: 0.95rem; color: #e2e8f0; }
        .lb-votes { font-weight: 600; color: #f97316; font-size: 0.95rem; }

        .lb-bar-wrap { width: 100px; background: #0f172a; border-radius: 1rem; height: 6px; }
        .lb-bar { height: 6px; border-radius: 1rem; background: linear-gradient(90deg, #f97316, #ef4444); }

        /* CALENDAR */
        .calendar-months {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2.5rem;
        }

        @media (min-width: 900px) {
            .calendar-months { grid-template-columns: repeat(3, 1fr); }
        }

        .month-card {
            background: #1e293b;
            border-radius: 1rem;
            padding: 1.2rem;
            border: 1px solid #334155;
        }

        .month-name {
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 1rem;
            color: #f97316;
            font-weight: 600;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.4rem;
            font-size: 0.8rem;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.25rem;
        }

        .day-cell {
            aspect-ratio: 1 / 1.25;
            background: #0f172a;
            border-radius: 0.4rem;
            padding: 0.2rem;
            font-size: 0.65rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid transparent;
            transition: border-color 0.2s;
            overflow: hidden;
        }

        .day-cell.today {
            border-color: #f97316;
            box-shadow: 0 0 8px rgba(249,115,22,0.4);
        }

        .day-number {
            font-weight: 600;
            font-size: 0.75rem;
            margin-bottom: 0.15rem;
            color: #cbd5e1;
        }

        .day-cell.outside-month { opacity: 0.4; }

        .event-tag {
            background: #334155;
            color: #f1f5f9;
            border-radius: 0.25rem;
            padding: 0.1rem 0.25rem;
            font-size: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            margin-bottom: 0.1rem;
            line-height: 1.3;
            text-align: center;
        }

        .event-tag.special   { background: #b45309; font-weight: 600; }
        .event-tag.deduction { background: #5b21b6; font-weight: 600; }
        .event-tag.social    { background: #0369a1; }

        /* CONTROLS */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .reset-btn {
            background: #334155;
            border: none;
            color: #cbd5e1;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .reset-btn:hover { background: #475569; }

        .filter-label {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        @media (max-width: 600px) {
            .event-tag { font-size: 0.45rem; }
            .day-cell  { padding: 0.15rem; }
            h1         { font-size: 1.6rem; }
        }
    </style>
</head>

            details: 'Last Saturday of each month, 09:00–18:00. Depart from Kitay-Gorod. ~2,500 ₽ includes transport and English guide. July: Sergiev Posad. August: Suzdal. September: Kolomenskoye estate. Pre-booking required — max 15 people.',
            venue: 'Depart from Kitay-Gorod metro',
            searchLink: 'https://www.google.com/search?q=day+trips+from+Moscow+English+guide',
            calTag: 'trip',
            isSpecial: true
        },

        /* ---- CREATIVE ---- */
        {
            id: 'cooking-class',
            name: 'Russian Cooking Class',
            emoji: '🥟',
            category: 'creative',
            badge: 'Creative',
            frequency: 'Fortnightly Sunday',
            shortDesc: 'Learn pelmeni, borscht & blinis — then eat what you cook! Class in English.',
            details: 'Fortnightly Sundays, 14:30–17:00 at Taste of Russia Studio (Kurskaya metro). 3,000 ₽ all-inclusive. Class entirely in English. All ingredients and equipment provided. ~8 participants per session. A wonderful cultural and culinary experience.',
            venue: 'Taste of Russia Studio (Kurskaya metro)',
            searchLink: 'https://www.google.com/search?q=Russian+cooking+class+Moscow+English',
            calTag: 'cooking',
            isSpecial: true
        },
        {
            id: 'art-wine',
            name: 'Art & Wine Night',
            emoji: '🎨',
            category: 'creative',
            badge: 'Creative',
            frequency: '1st Saturday monthly',
            shortDesc: 'Guided canvas painting + 2 glasses of wine. No experience needed. Just creativity and good vibes.',
            details: '1st Saturday of the month, 19:00–21:30 at Art Studio 8 (Smolenskaya metro). 2,500 ₽ includes all materials and 2 drinks. Relaxed atmosphere with background music. Professional artist guides you step by step. Take your painting home!',
            venue: 'Art Studio 8 (Smolenskaya metro)',
            searchLink: 'https://www.google.com/search?q=art+painting+wine+night+Moscow+English',
            calTag: 'art',
            isSpecial: true
        },
        {
            id: 'salsa',
            name: 'Salsa Class + Social Dance',
            emoji: '💃',
            category: 'creative',
            badge: 'Creative',
            frequency: 'Every Thursday',
            shortDesc: 'Bilingual beginner salsa lesson followed by an open social dance floor. No partner needed.',
            details: 'Every Thursday at 20:00 at Dance Studio 27 (Mayakovskaya metro). 700 ₽ drop-in. No partner required — rotations built in. Lesson 20:00–21:00, social dancing 21:00–23:00. Instructor gives directions in both English and Russian.',
            venue: 'Dance Studio 27 (Mayakovskaya metro)',
            searchLink: 'https://www.google.com/search?q=salsa+class+Moscow+English+beginners',
            calDay: 4 /* Thursday */
        }
    ];

    /* =========================================================
       VOTING LOGIC (localStorage)
       ========================================================= */
    function getStored(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
    }

    let activityLikes = getStored('activityLikes2', {});
    let likedList     = getStored('likedActivities2', []);
    activities.forEach(a => { if (!(a.id in activityLikes)) activityLikes[a.id] = 0; });

    function save() {
        localStorage.setItem('activityLikes2',    JSON.stringify(activityLikes));
        localStorage.setItem('likedActivities2',  JSON.stringify(likedList));
    }

    /* =========================================================
       LEADERBOARD
       ========================================================= */
    function renderLeaderboard() {
        const sorted = [...activities].sort((a, b) => (activityLikes[b.id] || 0) - (activityLikes[a.id] || 0));
        const top = sorted.slice(0, 5);
        const maxVotes = Math.max(...top.map(a => activityLikes[a.id] || 0), 1);
        const container = document.getElementById('lbRows');
        const medals = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];
        container.innerHTML = top.map((a, i) => {
            const v = activityLikes[a.id] || 0;
            const pct = Math.round((v / maxVotes) * 100);
            return `<div class="lb-row">
                <span class="lb-rank">${medals[i]}</span>
                <span class="lb-name">${a.emoji} ${a.name}</span>
                <div class="lb-bar-wrap"><div class="lb-bar" style="width:${pct}%"></div></div>
                <span class="lb-votes">${v}</span>
            </div>`;
        }).join('');
    }

    /* =========================================================
       ACTIVITY CARDS
       ========================================================= */
    let activeFilter = 'all';

    document.getElementById('tabBar').addEventListener('click', e => {
        const btn = e.target.closest('.tab-btn');
        if (!btn) return;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderActivityCards();
    });

    function renderActivityCards() {
        const container = document.getElementById('activitiesContainer');
        container.innerHTML = '';
        const filtered = activeFilter === 'all' ? activities : activities.filter(a => a.category === activeFilter);

        filtered.forEach(act => {
            const isLiked = likedList.includes(act.id);
            const count   = activityLikes[act.id] || 0;

            const card = document.createElement('div');
            card.className = `activity-card${act.isDeduction ? ' deduction' : ''}`;

            const badgeClass = {
                social: 'badge-social',
                deduction: 'badge-deduction',
                culture: 'badge-culture',
                active: 'badge-active',
                creative: 'badge-creative'
            }[act.category] || 'badge-social';

            const detailClass = act.isDeduction ? 'deduction-detail' : '';

            card.innerHTML = `
                <span class="category-badge ${badgeClass}">${act.badge}</span>
                <div class="card-header">
                    <span class="card-title">${act.emoji} ${act.name}</span>
                    <div class="vote-area">
                        <button class="vote-btn ${isLiked ? 'liked' : ''}" data-id="${act.id}" title="Vote">
                            ${isLiked ? '❤️' : '🤍'}
                        </button>
                        <span class="vote-count">${count}</span>
                    </div>
                </div>
                <p class="short-desc">${act.shortDesc}</p>
                <div class="venue-tag">📍 ${act.venue}</div>
                <div class="venue-tag">🗓️ ${act.frequency}</div>
                <button class="details-toggle" data-id="${act.id}" style="margin-top:0.8rem;">More info ▼</button>
                <div class="details-content ${detailClass}" id="details-${act.id}">
                    ${act.details}
                    <br>
                    <a href="${act.searchLink}" target="_blank" rel="noopener" class="external-link">
                        🔗 Find out more →
                    </a>
                </div>`;
            container.appendChild(card);
        });

        container.querySelectorAll('.vote-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const id  = btn.dataset.id;
                const idx = likedList.indexOf(id);
                if (idx === -1) {
                    likedList.push(id);
                    activityLikes[id] = (activityLikes[id] || 0) + 1;
                } else {
                    likedList.splice(idx, 1);
                    activityLikes[id] = Math.max((activityLikes[id] || 1) - 1, 0);
                }
                save();
                renderActivityCards();
                renderLeaderboard();
            });
        });

        container.querySelectorAll('.details-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const id  = btn.dataset.id;
                const div = document.getElementById('details-' + id);
                div.classList.toggle('open');
                btn.textContent = div.classList.contains('open') ? 'Less info ▲' : 'More info ▼';
            });
        });

        renderLeaderboard();
    }

    document.getElementById('resetVotesBtn').addEventListener('click', () => {
        if (!confirm('Reset all votes? This cannot be undone.')) return;
        localStorage.removeItem('activityLikes2');
        localStorage.removeItem('likedActivities2');
        activityLikes = {};
        likedList     = [];
        activities.forEach(a => { activityLikes[a.id] = 0; });
        save();
        renderActivityCards();
        renderLeaderboard();
    });

    /* =========================================================
       CALENDAR
       ========================================================= */
    function isSameDay(d1, d2) {
        return d1.getFullYear() === d2.getFullYear() &&
               d1.getMonth()    === d2.getMonth()    &&
               d1.getDate()     === d2.getDate();
    }

    function getEventsForDate(date, month) {
        const day     = date.getDay();   // 0=Sun … 6=Sat
        const dateNum = date.getDate();
        const events  = [];

        // ---- weekly ----
        if (day === 1) events.push({ id: 'pub-quiz',      tag: 'social' });
        if (day === 2) events.push({ id: 'language-exchange', tag: 'social' });
        if (day === 3) events.push({ id: 'board-games',   tag: 'social' });
        if (day === 4) events.push({ id: 'salsa',         tag: 'special' });
        if (day === 5) events.push({ id: 'expat-social',  tag: 'social' });
        if (day === 0) {
            events.push({ id: 'speed-meeting', tag: 'social' });
            events.push({ id: 'volleyball',    tag: 'active' });
            // fortnightly cooking: starting 6 Jul 2026 (first Sunday in July)
            const start = new Date(2026, 6, 5);
            const diff  = Math.floor((date - start) / 86400000);
            if (diff >= 0 && diff % 14 === 0) events.push({ id: 'cooking-class', tag: 'special' });
        }

        if (day === 6) { // Saturday
            events.push({ id: 'walking-tour', tag: 'social' });
            events.push({ id: 'yoga',          tag: 'active' });

            // 1st Saturday
            if (dateNum >= 1 && dateNum <= 7) {
                events.push({ id: 'art-wine', tag: 'special' });
                events.push({ id: 'mafia',    tag: 'deduction' });
            }
            // 2nd Saturday
            if (dateNum >= 8 && dateNum <= 14) {
                events.push({ id: 'museum-tour', tag: 'special' });
                events.push({ id: 'werewolf',    tag: 'deduction' });
            }
            // 3rd Saturday
            if (dateNum >= 15 && dateNum <= 21) {
                events.push({ id: 'movie-night', tag: 'special' });
                events.push({ id: 'avalon',      tag: 'deduction' });
            }
            // 4th Saturday
            if (dateNum >= 22 && dateNum <= 28) {
                events.push({ id: 'spyfall', tag: 'deduction' });
            }
            // Last Saturday (next Sat is in next month)
            const nextSat = new Date(date); nextSat.setDate(dateNum + 7);
            if (nextSat.getMonth() !== month) events.push({ id: 'day-trip', tag: 'special' });
        }

        // Blood on the Clocktower: last Friday of each month
        if (day === 5) {
            const nextFri = new Date(date); nextFri.setDate(dateNum + 7);
            if (nextFri.getMonth() !== month) events.push({ id: 'botc', tag: 'deduction' });
        }

        // Comedy night: 2nd Friday
        if (day === 5 && dateNum >= 8 && dateNum <= 14) {
            events.push({ id: 'comedy', tag: 'special' });
        }

        return events;
    }

    function getActivity(id) { return activities.find(a => a.id === id); }

    function renderCalendar() {
        const container = document.getElementById('calendarContainer');
        container.innerHTML = '';
        const months = [
            { name: 'July 2026',      month: 6, year: 2026 },
            { name: 'August 2026',    month: 7, year: 2026 },
            { name: 'September 2026', month: 8, year: 2026 }
        ];
        const today = new Date();

        months.forEach(mon => {
            const firstDay    = new Date(mon.year, mon.month, 1);
            const lastDay     = new Date(mon.year, mon.month + 1, 0);
            const startDOW    = firstDay.getDay();
            const mondayOff   = startDOW === 0 ? 6 : startDOW - 1;
            const prevLast    = new Date(mon.year, mon.month, 0).getDate();
            const cells       = [];

            for (let i = mondayOff - 1; i >= 0; i--)
                cells.push({ date: new Date(mon.year, mon.month - 1, prevLast - i), cur: false });
            for (let d = 1; d <= lastDay.getDate(); d++)
                cells.push({ date: new Date(mon.year, mon.month, d), cur: true });
            const rem = (7 - (cells.length % 7)) % 7;
            for (let i = 1; i <= rem; i++)
                cells.push({ date: new Date(mon.year, mon.month + 1, i), cur: false });

            const card = document.createElement('div');
            card.className = 'month-card';
            card.innerHTML = `
                <div class="month-name">${mon.name}</div>
                <div class="weekdays">
                    <span>Mon</span><span>Tue</span><span>Wed</span>
                    <span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
                </div>
                <div class="days-grid" id="grid-${mon.name.replace(/\s/g,'')}"></div>`;
            container.appendChild(card);

            const grid = card.querySelector('.days-grid');
            cells.forEach(cell => {
                const evts    = cell.cur ? getEventsForDate(cell.date, mon.month) : [];
                const isToday = isSameDay(cell.date, today);
                const dc      = document.createElement('div');
                dc.className  = `day-cell${!cell.cur ? ' outside-month' : ''}${isToday ? ' today' : ''}`;
                let html      = `<span class="day-number">${cell.date.getDate()}</span>`;
                // Show max 3 event tags to avoid overflow
                evts.slice(0, 3).forEach(ev => {
                    const act = getActivity(ev.id);
                    if (act) html += `<span class="event-tag ${ev.tag}" title="${act.name}">${act.emoji} ${act.name.split(' ')[0]}</span>`;
                });
                if (evts.length > 3) html += `<span class="event-tag" title="more events">+${evts.length - 3}</span>`;
                dc.innerHTML = html;
                grid.appendChild(dc);
            });
        });
    }

    /* ---- INIT ---- */
    renderActivityCards();
    renderCalendar();

})();
</script>
</body>
</html>
